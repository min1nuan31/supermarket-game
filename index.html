<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>超市模擬器 - 行動網頁版</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
            touch-action: none;
        }

        canvas {
            display: block;
        }

        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00ff00;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
        }

        #joystick-zone {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 140px;
            height: 140px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            touch-action: none;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        #joystick-knob {
            position: absolute;
            top: 45px;
            left: 45px;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
        }

        .action-btn {
            position: absolute;
            right: 20px;
            width: 110px;
            height: 55px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            opacity: 0.85;
        }

        #btn-interact {
            bottom: 90px;
            background: #0055ff;
        }

        #btn-stock {
            bottom: 20px;
            background: #00aa00;
        }

        #pos-ui {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .pos-screen {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 400px;
            text-align: center;
        }

        .pos-btn {
            margin: 10px;
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

    <div id="hud">金錢: $<span id="money-text">100.00</span></div>

    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>
    <button id="btn-interact" class="action-btn">E / 互動</button>
    <button id="btn-stock" class="action-btn">補貨</button>

    <div id="pos-ui">
        <div class="pos-screen">
            <h2>--- POS 結帳系統 ---</h2>
            <p id="pos-total">總計: $0.00</p>
            <p id="pos-mode">付款方式: 刷卡</p>
            <div id="checkout-action-area"></div>
            <button class="pos-btn" style="background:#ff4444;" onclick="closeCheckout()">離開收銀</button>
        </div>
    </div>

    <script>
        // 1. 初始化 3D 場景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.8, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 7.5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        const grid = new THREE.GridHelper(20, 20);
        scene.add(grid);

        const shelf = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 3), new THREE.MeshLambertMaterial({ color: 0x0000ff }));
        shelf.position.set(-2, 1, 0); scene.add(shelf);

        const computer = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.5, 0.8), new THREE.MeshLambertMaterial({ color: 0x008800 }));
        computer.position.set(3, 0.75, 0); scene.add(computer);

        const counter = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1, 0.8), new THREE.MeshLambertMaterial({ color: 0xffd700 }));
        counter.position.set(0, 0.75, 2); scene.add(counter);

        let money = 100.00;
        let inCheckout = false;
        let moveDir = { x: 0, y: 0 };

        // 2. 搖桿邏輯
        const zone = document.getElementById('joystick-zone');
        const knob = document.getElementById('joystick-knob');
        let joystickTouchId = null;

        zone.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            const t = e.changedTouches[0];
            joystickTouchId = t.identifier;
        });

        zone.addEventListener('touchmove', (e) => {
            e.stopPropagation();
            for (let t of e.changedTouches) {
                if (t.identifier === joystickTouchId) {
                    const rect = zone.getBoundingClientRect();
                    let x = t.clientX - rect.left - 70;
                    let y = t.clientY - rect.top - 70;
                    const dist = Math.hypot(x, y);
                    if (dist > 45) { x = (x / dist) * 45; y = (y / dist) * 45; }
                    knob.style.transform = `translate(${x}px, ${y}px)`;
                    moveDir.x = x / 45;
                    moveDir.y = y / 45;
                }
            }
        });

        const resetJoystick = (e) => {
            e.stopPropagation();
            knob.style.transform = `translate(0px, 0px)`;
            moveDir = { x: 0, y: 0 };
            joystickTouchId = null;
        };
        zone.addEventListener('touchend', resetJoystick);
        zone.addEventListener('touchcancel', resetJoystick);

        // 3. 視角旋轉 (右側觸控/單指滑動)
        let cameraYaw = 0;
        let cameraPitch = 0;
        let lookTouchId = null;
        let previousTouchX = 0, previousTouchY = 0;

        window.addEventListener('touchstart', (e) => {
            for (let t of e.changedTouches) {
                if (t.clientX > window.innerWidth / 3 && lookTouchId === null) {
                    lookTouchId = t.identifier;
                    previousTouchX = t.clientX;
                    previousTouchY = t.clientY;
                }
            }
        });

        window.addEventListener('touchmove', (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === lookTouchId) {
                    const deltaX = t.clientX - previousTouchX;
                    const deltaY = t.clientY - previousTouchY;

                    cameraYaw -= deltaX * 0.005;
                    cameraPitch -= deltaY * 0.005;
                    cameraPitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, cameraPitch));

                    previousTouchX = t.clientX;
                    previousTouchY = t.clientY;
                }
            }
        });

        const resetLook = (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === lookTouchId) lookTouchId = null;
            }
        };
        window.addEventListener('touchend', resetLook);
        window.addEventListener('touchcancel', resetLook);

        // 4. UI 互動
        document.getElementById('btn-interact').onclick = () => {
            if (camera.position.distanceTo(counter.position) < 3) openCheckout();
        };

        function openCheckout() {
            inCheckout = true;
            document.getElementById('pos-ui').style.display = 'flex';
            const isCard = Math.random() > 0.5;
            const total = (Math.floor(Math.random() * 5) + 1) * 5;
            document.getElementById('pos-total').innerText = `總計: $${total}.00`;
            document.getElementById('pos-mode').innerText = `付款方式: ${isCard ? '信用卡' : '現金'}`;
            document.getElementById('checkout-action-area').innerHTML = `<button class="pos-btn" style="background:#00aa00; color:white;" onclick="finishCheckout(${total})">完成結帳</button>`;
        }

        function finishCheckout(amount) {
            money += amount;
            document.getElementById('money-text').innerText = money.toFixed(2);
            closeCheckout();
        }

        function closeCheckout() {
            inCheckout = false;
            document.getElementById('pos-ui').style.display = 'none';
        }

        // 5. 渲染與更新循環
        function animate() {
            requestAnimationFrame(animate);

            if (!inCheckout) {
                const speed = 0.08;
                const forwardX = -Math.sin(cameraYaw);
                const forwardZ = -Math.cos(cameraYaw);
                const rightX = Math.cos(cameraYaw);
                const rightZ = -Math.sin(cameraYaw);

                camera.position.x += (forwardX * (-moveDir.y) + rightX * moveDir.x) * speed;
                camera.position.z += (forwardZ * (-moveDir.y) + rightZ * moveDir.x) * speed;

                const euler = new THREE.Euler(cameraPitch, cameraYaw, 0, 'YXZ');
                camera.quaternion.setFromEuler(euler);
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
