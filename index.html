<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>超市模擬器 - 行動網頁版</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
            touch-action: none;
        }

        canvas {
            display: block;
        }

        /* HUD 金錢與狀態提示 */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00ff00;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
            z-index: 5;
        }

        #prompt-text {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 3px black;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 16px;
            border-radius: 15px;
            display: none;
            z-index: 5;
        }

        /* 螢幕正中央準心 (動態變色) */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(0, 0, 0, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
            transition: transform 0.1s, background-color 0.1s;
        }

        #crosshair.active {
            background-color: #00ff00;
            transform: translate(-50%, -50%) scale(1.5);
        }

        /* 虛擬搖桿 UI */
        #joystick-zone {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 140px;
            height: 140px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            touch-action: none;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        #joystick-knob {
            position: absolute;
            top: 45px;
            left: 45px;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
        }

        /* 動作按鈕 (預設隱藏，對準物品時自動跳出) */
        .action-btn {
            position: absolute;
            right: 20px;
            width: 110px;
            height: 55px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            opacity: 0.9;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            z-index: 15;
        }

        #btn-interact {
            bottom: 90px;
            background: #0055ff;
            display: none;
        }

        #btn-drop {
            bottom: 20px;
            background: #ff4444;
            display: none;
        }

        /* 通用彈出選單 UI */
        .modal-ui {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        .modal-screen {
            background: #222;
            padding: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 450px;
            text-align: center;
            border: 1px solid #444;
        }

        .modal-btn {
            margin: 8px;
            padding: 10px 18px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 電腦訂購專用樣式 */
        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #333;
            margin: 8px 0;
            padding: 10px;
            border-radius: 8px;
        }

        #cart-list {
            max-height: 120px;
            overflow-y: auto;
            text-align: left;
            background: #111;
            padding: 8px;
            border-radius: 6px;
            font-size: 14px;
            color: #aaa;
            margin-top: 8px;
        }
    </style>

    <!-- 引入 Three.js 核心庫與 GLTF 載入器 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>

<body>

    <div id="hud">金錢: $<span id="money-text">100.00</span></div>
    <div id="prompt-text">瞄準提示</div>
    <div id="crosshair"></div>

    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <button id="btn-interact" class="action-btn">E / 互動</button>
    <button id="btn-drop" class="action-btn">放下紙箱</button>

    <!-- POS 結帳介面 -->
    <div id="pos-ui" class="modal-ui">
        <div class="modal-screen">
            <h2>--- POS 結帳系統 ---</h2>
            <p id="pos-total">總計: $0.00</p>
            <p id="pos-mode">付款方式: 刷卡</p>
            <div id="checkout-action-area"></div>
            <button id="btn-close-pos" class="modal-btn" style="background:#ff4444; color:white;">離開收銀</button>
        </div>
    </div>

    <!-- 電腦訂購介面 -->
    <div id="order-ui" class="modal-ui">
        <div class="modal-screen">
            <h2>🛒 商品進貨訂購單</h2>

            <div class="order-item">
                <span>牛奶箱 (5入) - $20</span>
                <button id="btn-buy-milk" class="modal-btn" style="background:#0055ff; color:white;">+ 加入</button>
            </div>
            <div class="order-item">
                <span>洋芋片箱 (5入) - $15</span>
                <button id="btn-buy-chips" class="modal-btn" style="background:#0055ff; color:white;">+ 加入</button>
            </div>
            <div class="order-item">
                <span>飲料箱 (5入) - $18</span>
                <button id="btn-buy-drink" class="modal-btn" style="background:#0055ff; color:white;">+ 加入</button>
            </div>

            <div id="cart-list">已選清單: 無</div>
            <h3 id="order-total" style="color:#00ff00;">總計: $0.00</h3>

            <button id="btn-order-checkout" class="modal-btn" style="background:#00aa00; color:white;">確認付款下單</button>
            <button id="btn-close-order" class="modal-btn" style="background:#888; color:white;">關閉電腦</button>
        </div>
    </div>

    <!-- 主 JS 模組腳本 (必須使用 type="module") -->
    <script type="module" src="js/main.js"></script>
</body>

</html>
